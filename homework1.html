<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Instagram Login Mockup</title>

    <link rel="stylesheet" href="css/homework1.css">
</head>

<body>

    <div class="main">

        <div class="logo">
            <h1><i>INSTAGRAM</i></h1>
        </div>

        <div class="sub">

            <div class="signin">

                <p>Log into Instagram</p>

                <input type="text" placeholder="Mobile number, username or email">

                <input type="password"name="password" placeholder="Password">

                <button type="button">Log in</button>

                <h3>OR</h3>

                <button type="button">
                    Log in with Facebook
                </button>

                <br>
                <br>

                <button type="button">
                    Forgot password?
                </button>

            </div>

            <div class="login">

                <p>Don't have an account?</p>

                <button type="button">
                    Sign up
                </button>

            </div>

        </div>

    </div>

</body>
</html>
